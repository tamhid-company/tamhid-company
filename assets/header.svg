<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0c2a5b"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0%" stop-color="#7dd3fc"><animate attributeName="stop-color" values="#7dd3fc;#38bdf8;#e0f2fe;#7dd3fc" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#e0f2fe;#0ea5e9;#38bdf8" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="wave" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#0ea5e9" stop-opacity=".1"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .w1{animation:drift 14s linear infinite}
      .w2{animation:drift 22s linear infinite reverse}
      @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-500px)}}
      .star{animation:tw 3s ease-in-out infinite}
      .star:nth-child(2n){animation-delay:1s}.star:nth-child(3n){animation-delay:2s}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      .ring{transform-origin:110px 130px;animation:spin 12s linear infinite}
      .ring2{transform-origin:110px 130px;animation:spin 8s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .title{animation:up 1.2s ease-out both}
      .sub{animation:up 1.2s .4s ease-out both}
      @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
      .pulse{animation:pl 2.4s ease-in-out infinite}
      @keyframes pl{0%,100%{r:34}50%{r:38}}
    </style>
  </defs>
  <rect width="1000" height="260" rx="22" fill="url(#bg)"/>
  <g fill="#e0f2fe">
    <circle class="star" cx="820" cy="40" r="1.6"/><circle class="star" cx="900" cy="90" r="1.2"/><circle class="star" cx="760" cy="120" r="1.4"/>
    <circle class="star" cx="950" cy="50" r="1.8"/><circle class="star" cx="700" cy="60" r="1.1"/><circle class="star" cx="860" cy="180" r="1.3"/>
    <circle class="star" cx="640" cy="30" r="1.5"/><circle class="star" cx="980" cy="140" r="1.2"/><circle class="star" cx="720" cy="200" r="1.4"/>
  </g>
  <g class="w1"><path d="M0 200 C120 170 220 230 340 200 S560 170 680 200 S900 230 1020 200 S1240 170 1360 200 S1500 230 1500 230 V260 H0Z" fill="url(#wave)"/></g>
  <g class="w2"><path d="M0 220 C150 250 250 190 400 220 S650 250 800 220 S1050 190 1200 220 S1450 250 1500 220 V260 H0Z" fill="url(#wave)"/></g>
  <g filter="url(#glow)">
    <circle class="pulse" cx="110" cy="130" r="34" fill="#38bdf8"/>
    <path d="M92 130 L106 144 L130 116" stroke="#020617" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle class="ring" cx="110" cy="130" r="56" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="18 12" fill="none" opacity=".8"/>
  <circle class="ring2" cx="110" cy="130" r="72" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 10" fill="none" opacity=".6"/>
  <text class="title" x="210" y="120" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#txt)" letter-spacing="1">Tamhid Co</text>
  <text class="sub" x="214" y="165" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="22" fill="#bae6fd" letter-spacing="4">WEB · AUTOMATION · AI</text>
</svg>

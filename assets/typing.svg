<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="60" viewBox="0 0 1000 60">
  <style>
    text{font-family:'Fira Code',Consolas,monospace;font-size:24px;fill:#38bdf8}
    .line{clip-path:inset(0 100% 0 0);animation:type 12s steps(60) infinite}
    .l2{animation-delay:4s}.l3{animation-delay:8s}
    @keyframes type{0%{clip-path:inset(0 100% 0 0);opacity:1}25%{clip-path:inset(0 0 0 0);opacity:1}33%{opacity:1}34%{opacity:0}100%{opacity:0}}
    .cur{animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <text x="20" y="38" fill="#7dd3fc" style="fill:#7dd3fc">$</text>
  <text class="line" x="45" y="38">ما محصولات ساده، قابل اتکا و قابل نگهداری می‌سازیم.</text>
  <text class="line l2" x="45" y="38">Building reliable web apps, automations and AI tools.</text>
  <text class="line l3" x="45" y="38">Small team. Clear standards. Fast delivery.</text>
  <rect class="cur" x="30" y="18" width="3" height="26" fill="#38bdf8"/>
</svg>
